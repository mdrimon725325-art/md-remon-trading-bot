
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD REMON TRADING BOT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 min-height:100vh;
 font-family:Arial,sans-serif;
 color:white;
 background:#080b12 url("./background.png") center/cover fixed no-repeat;
}
.page{min-height:100vh;padding:18px 12px;background:rgba(0,0,0,.12)}
h1{text-align:center;color:#ffe66d;font-size:25px;margin:12px 0}
.subtitle{text-align:center;letter-spacing:2px;margin-bottom:22px}
.panel,.login,.signal-box{
 max-width:480px;margin:15px auto;padding:17px;
 border:1px solid rgba(255,255,255,.4);
 border-radius:17px;background:rgba(0,0,0,.24);
 backdrop-filter:blur(3px)
}
label{display:block;margin:13px 0 8px;color:#ffe66d;font-weight:bold}
input,select,button{
 width:100%;padding:13px;border-radius:10px;
 border:1px solid rgba(255,255,255,.7);
 background:rgba(0,0,0,.55);color:white;font-size:16px
}
input::placeholder{color:#ddd}
select option{background:#111;color:white}
button{cursor:pointer;font-weight:bold;margin-top:14px}
.login-btn{border:2px solid #ffe66d;color:#ffe66d}
.generate-btn{
 border:2px solid #00ff9d;color:#00ff9d;
 font-size:18px;background:rgba(0,30,20,.6)
}
.logout-btn{border-color:#ff7777;color:#ffaaaa}
button:disabled{opacity:.5}
.status{text-align:center;margin:15px 0;color:#ffe66d;font-weight:bold}
.market-list{
 display:none;max-height:190px;overflow-y:auto;margin-top:5px;
 border:1px solid white;border-radius:9px;background:rgba(0,0,0,.9)
}
.market-item{padding:12px;border-bottom:1px solid #555;cursor:pointer}
.market-item:hover{color:#ffe66d}
#dashboard{display:none}
#countdown{
 text-align:center;font-size:65px;font-weight:bold;
 margin:18px 0;animation:pulse .8s infinite alternate
}
@keyframes pulse{
 from{transform:scale(1);text-shadow:0 0 8px currentColor}
 to{transform:scale(1.12);text-shadow:0 0 25px currentColor}
}
.c10{color:#ff3030}.c9{color:#ff7b00}
.c8{color:#ffe600}.c7{color:#aaff00}
.c6{color:#00ff85}.c5{color:#00eaff}
.c4{color:#278bff}.c3{color:#a45cff}
.c2{color:#ff4de1}.c1{color:white}
.progress{height:7px;background:#ffffff40;border-radius:10px;overflow:hidden}
#progressBar{height:100%;width:0;background:linear-gradient(90deg,#00ff83,#ffe66d,#ff3b3b);transition:width 1s}
#signal{text-align:center;font-size:35px;font-weight:bold;margin:20px 0}
.up{color:#00ff83;text-shadow:0 0 15px #00ff83}
.down{color:#ff5555;text-shadow:0 0 15px #ff5555}
.info{text-align:center;font-size:14px;margin:10px 0}
@media(max-width:600px){body{background-attachment:scroll}}
</style>
</head>
<body>
<div class="page">

<h1>MD REMON TRADING BOT</h1>
<div class="subtitle">SMART SIGNAL PLATFORM</div>

<div class="login" id="login">
 <label>USERNAME</label>
 <input id="username" type="text" placeholder="Enter username">
 <label>PASSWORD</label>
 <input id="password" type="password" placeholder="Enter password">
 <button class="login-btn" onclick="login()">LOGIN</button>
 <div class="status" id="loginStatus"></div>
</div>

<div id="dashboard">
 <div class="panel">
  <label>SEARCH MARKET</label>
  <input id="marketSearch" placeholder="Search market..."
   autocomplete="off" onfocus="showMarkets()" oninput="filterMarkets()">
  <div class="market-list" id="marketList"></div>

  <div class="status">
   SELECTED MARKET: <span id="selectedMarket">None</span>
  </div>

  <label>TRADE DURATION</label>
  <select id="duration">
   <option value="5">5 Seconds</option>
   <option value="10">10 Seconds</option>
   <option value="15">15 Seconds</option>
   <option value="30">30 Seconds</option>
   <option value="60">1 Minute</option>
   <option value="300">5 Minutes</option>
  </select>

  <button class="generate-btn" id="generateBtn" onclick="generateSignal()">
   GET SIGNAL
  </button>
 </div>

 <div class="signal-box">
  <div class="status" id="status">READY FOR SIGNAL</div>
  <div id="countdown"></div>
  <div class="progress"><div id="progressBar"></div></div>
  <div id="signal"></div>
  <div class="info" id="signalMarket"></div>
  <div class="info" id="signalDuration"></div>
 </div>

 <button class="logout-btn" onclick="logout()">LOGOUT</button>
</div>

</div>

<script>
const markets=[
"USD/INR (OTC)","USD/BRL (OTC)","USD/NGN (OTC)",
"USD/PHP (OTC)","CAD/JPY","NZD/JPY (OTC)",
"EUR/USD","AUD/JPY","EUR/GBP","USD/BDT (OTC)",
"USD/MXN (OTC)","USD/PKR (OTC)","GBP/USD",
"NZD/USD (OTC)","USD/COP (OTC)","EUR/JPY"
];

let selected="";
let countdownTimer=null;

function login(){
 const user=document.getElementById("username").value;
 const pass=document.getElementById("password").value;
 if(user==="mdremon" && pass==="mdremon"){
  document.getElementById("login").style.display="none";
  document.getElementById("dashboard").style.display="block";
 }else{
  document.getElementById("loginStatus").textContent="Wrong username or password!";
 }
}

function logout(){
 clearInterval(countdownTimer);
 document.getElementById("dashboard").style.display="none";
 document.getElementById("login").style.display="block";
 document.getElementById("username").value="";
 document.getElementById("password").value="";
 resetSignal();
}

function showMarkets(){
 document.getElementById("marketList").style.display="block";
 renderMarkets(markets);
}

function renderMarkets(items){
 const list=document.getElementById("marketList");
 list.innerHTML="";
 items.forEach(market=>{
  const item=document.createElement("div");
  item.className="market-item";
  item.textContent=market;
  item.onclick=()=>{
   selected=market;
   document.getElementById("marketSearch").value=market;
   document.getElementById("selectedMarket").textContent=market;
   list.style.display="none";
  };
  list.appendChild(item);
 });
}

function filterMarkets(){
 const q=document.getElementById("marketSearch").value.toLowerCase();
 document.getElementById("marketList").style.display="block";
 renderMarkets(markets.filter(m=>m.toLowerCase().includes(q)));
}

document.addEventListener("click",e=>{
 const search=document.getElementById("marketSearch");
 const list=document.getElementById("marketList");
 if(e.target!==search && !list.contains(e.target)){
  list.style.display="none";
 }
});

function resetSignal(){
 document.getElementById("status").textContent="READY FOR SIGNAL";
 document.getElementById("countdown").textContent="";
 document.getElementById("countdown").className="";
 document.getElementById("signal").textContent="";
 document.getElementById("signal").className="";
 document.getElementById("signalMarket").textContent="";
 document.getElementById("signalDuration").textContent="";
 document.getElementById("progressBar").style.width="0%";
 document.getElementById("generateBtn").disabled=false;
}

function generateSignal(){
 if(!selected){alert("Please select a market first!");return;}
 clearInterval(countdownTimer);
 const duration=document.getElementById("duration").value;
 let count=10;
 document.getElementById("generateBtn").disabled=true;
 document.getElementById("status").textContent="ANALYZING...";
 document.getElementById("signal").textContent="";
 document.getElementById("signalMarket").textContent="MARKET: "+selected;
 document.getElementById("signalDuration").textContent="TIMER: "+formatDuration(duration);
 updateCountdown(count);

 countdownTimer=setInterval(()=>{
  count--;
  updateCountdown(count);
  if(count<=0){
   clearInterval(countdownTimer);
   showSignal();
  }
 },1000);
}

function updateCountdown(count){
 const number=document.getElementById("countdown");
 number.textContent=count;
 number.className="c"+count;
 document.getElementById("progressBar").style.width=((10-count)*10)+"%";
}

function showSignal(){
 const isUp=Math.random()>=0.5;
 const signal=document.getElementById("signal");
 signal.textContent=isUp?"UP / BUY":"DOWN / SELL";
 signal.className=isUp?"up":"down";
 document.getElementById("status").textContent="SIGNAL GENERATED";
 document.getElementById("countdown").textContent="✓";
 document.getElementById("countdown").className="c5";
 document.getElementById("progressBar").style.width="100%";
 document.getElementById("generateBtn").disabled=false;
}

function formatDuration(value){
 if(value==="60")return "1 Minute";
 if(value==="300")return "5 Minutes";
 return value+" Seconds";
}
</script>
</body>
</html>
