
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD REMON TRADING BOT</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  min-height: 100%;
  font-family: Arial, sans-serif;
  color: white;
  background: transparent;
}

body {
  min-height: 100vh;
  background-image: url("./background.png");
  background-size: contain;
  background-position: center center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  text-shadow: 0 2px 5px #000, 0 0 8px #000;
}

.page {
  min-height: 100vh;
  padding: 20px 14px 35px;
  background: transparent !important;
}

h1 {
  text-align: center;
  color: #ffe66d;
  font-size: 25px;
  margin: 12px 0 8px;
  text-shadow: 0 2px 8px black;
}

.subtitle {
  text-align: center;
  color: white;
  margin-bottom: 25px;
  font-size: 13px;
}

.panel, .login, .signal-box, .result-box {
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  backdrop-filter: none !important;
  padding: 12px 0;
  margin: 12px auto;
  max-width: 500px;
}

label {
  display: block;
  margin: 14px 0 7px;
  font-weight: bold;
  color: #ffe66d;
}

input, select, button {
  width: 100%;
  padding: 13px;
  border-radius: 9px;
  border: 1px solid rgba(255,255,255,.85);
  background: transparent !important;
  color: white;
  font-size: 16px;
  outline: none;
  text-shadow: 0 2px 5px black;
}

input::placeholder {
  color: #eee;
}

select option {
  background: #222;
  color: white;
}

button {
  font-weight: bold;
  cursor: pointer;
  margin-top: 14px;
  color: #fff;
}

button:active {
  transform: scale(.98);
}

.login-btn {
  border: 2px solid #ffe66d;
  color: #ffe66d;
}

.generate-btn {
  border: 2px solid #00ff9d;
  color: #00ff9d;
  font-size: 18px;
}

.logout-btn {
  border-color: #ff7777;
  color: #ffaaaa;
}

#dashboard {
  display: none;
}

.market-list {
  display: none;
  max-height: 190px;
  overflow-y: auto;
  border: 1px solid rgba(255,255,255,.6);
  border-radius: 8px;
  margin-top: 5px;
  background: transparent;
}

.market-item {
  padding: 11px;
  border-bottom: 1px solid rgba(255,255,255,.35);
  cursor: pointer;
  color: white;
  text-shadow: 0 2px 5px black;
}

.market-item:active {
  color: #ffe66d;
}

.status {
  text-align: center;
  margin: 18px 0;
  color: #ffe66d;
  font-weight: bold;
}

#countdown {
  text-align: center;
  font-size: 42px;
  font-weight: bold;
  color: #ffe66d;
  margin: 15px;
}

#signal {
  text-align: center;
  font-size: 42px;
  font-weight: bold;
  margin: 15px 0;
}

.up {
  color: #00ff83;
}

.down {
  color: #ff5555;
}

.small {
  text-align: center;
  font-size: 12px;
  margin-top: 18px;
  color: white;
}

.hidden {
  display: none !important;
}

@media (max-width: 600px) {
  body {
    background-attachment: scroll;
  }
  .page {
    padding-top: 15px;
  }
}
</style>
</head>

<body>
<div class="page">

  <h1>MD REMON TRADING BOT</h1>
  <div class="subtitle">SMART SIGNAL DASHBOARD</div>

  <!-- LOGIN -->
  <div class="login" id="login">
    <label>Username</label>
    <input id="username" type="text" placeholder="Enter username">

    <label>Password</label>
    <input id="password" type="password" placeholder="Enter password">

    <button class="login-btn" onclick="login()">LOGIN</button>
    <div class="status" id="loginStatus"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">

    <div class="panel">
      <label>SEARCH MARKET</label>
      <input
        id="marketSearch"
        type="text"
        placeholder="Search market..."
        autocomplete="off"
        onfocus="showMarkets()"
        oninput="filterMarkets()"
      >
      <div class="market-list" id="marketList"></div>

      <div class="status">
        Selected Market: <span id="selectedMarket">None</span>
      </div>

      <label>TRADE DURATION</label>
      <select id="duration">
        <option value="5">5 Seconds</option>
        <option value="10">10 Seconds</option>
        <option value="15">15 Seconds</option>
        <option value="30">30 Seconds</option>
        <option value="60">1 Minute</option>
        <option value="300">5 Minutes</option>
      </select>

      <button class="generate-btn" id="generateBtn" onclick="generateSignal()">
        GENERATE SIGNAL
      </button>
    </div>

    <div class="signal-box">
      <div class="status" id="status">READY FOR SIGNAL</div>
      <div id="countdown"></div>
      <div id="signal"></div>
      <div class="status" id="signalMarket"></div>
      <div class="status" id="signalDuration"></div>
    </div>

    <div class="small">
      MD REMON TRADING BOT
    </div>

    <button class="logout-btn" onclick="logout()">LOGOUT</button>
  </div>

  <div class="small">
    For demonstration only. Signals are random and are not live market predictions.
  </div>

</div>

<script>
const markets = [
  "USD/INR (OTC)",
  "USD/BRL (OTC)",
  "USD/NGN (OTC)",
  "USD/PHP (OTC)",
  "CAD/JPY",
  "NZD/JPY (OTC)",
  "EUR/USD",
  "AUD/JPY",
  "EUR/GBP",
  "USD/BDT (OTC)",
  "USD/MXN (OTC)",
  "USD/PKR (OTC)",
  "GBP/USD",
  "NZD/USD (OTC)",
  "USD/COP (OTC)",
  "EUR/JPY"
];

let selected = "";
let countdownTimer = null;

function login() {
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;

  if (user === "mdremon" && pass === "mdremon") {
    document.getElementById("login").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    document.getElementById("loginStatus").textContent = "";
  } else {
    document.getElementById("loginStatus").textContent =
      "Wrong username or password!";
  }
}

function logout() {
  clearInterval(countdownTimer);
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("login").style.display = "block";
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
  resetSignal();
}

function showMarkets() {
  const list = document.getElementById("marketList");
  list.style.display = "block";
  renderMarkets(markets);
}

function renderMarkets(items) {
  const list = document.getElementById("marketList");
  list.innerHTML = "";

  items.forEach(market => {
    const item = document.createElement("div");
    item.className = "market-item";
    item.textContent = market;

    item.onclick = function() {
      selected = market;
      document.getElementById("marketSearch").value = market;
      document.getElementById("selectedMarket").textContent = market;
      list.style.display = "none";
    };

    list.appendChild(item);
  });
}

function filterMarkets() {
  const query = document.getElementById("marketSearch")
    .value.toLowerCase();

  document.getElementById("marketList").style.display = "block";

  const filtered = markets.filter(market =>
    market.toLowerCase().includes(query)
  );

  renderMarkets(filtered);
}

document.addEventListener("click", function(event) {
  const search = document.getElementById("marketSearch");
  const list = document.getElementById("marketList");

  if (event.target !== search && !list.contains(event.target)) {
    list.style.display = "none";
  }
});

function resetSignal() {
  document.getElementById("status").textContent = "READY FOR SIGNAL";
  document.getElementById("countdown").textContent = "";
  document.getElementById("signal").textContent = "";
  document.getElementById("signal").className = "";
  document.getElementById("signalMarket").textContent = "";
  document.getElementById("signalDuration").textContent = "";
  document.getElementById("generateBtn").disabled = false;
}

function generateSignal() {
  if (!selected) {
    alert("Please select a market first!");
    return;
  }

  clearInterval(countdownTimer);

  const duration = document.getElementById("duration").value;
  let count = 10;

  document.getElementById("generateBtn").disabled = true;
  document.getElementById("status").textContent = "ANALYZING...";
  document.getElementById("signal").textContent = "";
  document.getElementById("signalMarket").textContent =
    "Market: " + selected;
  document.getElementById("signalDuration").textContent =
    "Duration: " + formatDuration(duration);
  document.getElementById("countdown").textContent = count;

  countdownTimer = setInterval(() => {
    count--;
    document.getElementById("countdown").textContent = count;

    if (count <= 0) {
      clearInterval(countdownTimer);
      showSignal();
    }
  }, 1000);
}

function showSignal() {
  const isUp = Math.random() >= 0.5;
  const signal = document.getElementById("signal");

  if (isUp) {
    signal.textContent = "UP / BUY";
    signal.className = "up";
  } else {
    signal.textContent = "DOWN / SELL";
    signal.className = "down";
  }

  document.getElementById("status").textContent = "DEMO SIGNAL GENERATED";
  document.getElementById("countdown").textContent = "✓";
  document.getElementById("generateBtn").disabled = false;
}

function formatDuration(value) {
  if (value === "60") return "1 Minute";
  if (value === "300") return "5 Minutes";
  return value + " Seconds";
}
</script>
</body>
</html>
